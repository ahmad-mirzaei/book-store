
{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="card mx-auto p-4 text-center" style="max-width: 500px;">
        <h3 class="text-success">پرداخت آزمایشی موفق بود</h3>

<p class="mt-3">
    سفارش شما با موفقیت پرداخت شد.
</p>

<div class="border rounded p-3 my-3">
    <strong>کد پیگیری سفارش:</strong>
    <p class="mt-2 mb-0" dir="ltr">
        {{ order.tracking_code }}
    </p>
</div>

<p class="text-muted small">
    این کد را برای پیگیری سفارش نزد خود نگه دارید.
</p>

        <p>
            مبلغ پرداخت‌شده:
            {{ order.get_total_price }} تومان
        </p>

        <a href="{% url 'home' %}" class="btn btn-book-detail mt-3">
            بازگشت به فروشگاه
        </a>
    </div>
</div>
{% endblock %}
