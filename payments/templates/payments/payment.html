
{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="card mx-auto p-4 text-center" style="max-width: 500px;">
        <h3>پرداخت آزمایشی</h3>
        <form method="post"
            action="{% url 'cancel_order' order.id %}"
            class="mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger">
                لغو سفارش
            </button>
        </form>

        <p class="mt-3">
            شماره سفارش: {{ order.id }}
        </p>

        <h4 class="my-3">
            مبلغ قابل پرداخت:
            {{ order.get_total_price }} تومان
        </h4>

        <p class="text-muted">
            این پرداخت واقعی نیست و فقط برای آزمایش فروشگاه است.
        </p>

        <form method="POST" action="{% url 'payment_success' order.id %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-book-detail w-100">
                پرداخت موفق آزمایشی
            </button>
        </form>
    </div>
</div>
{% endblock %}
