
{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card p-4 shadow-sm">
                <h3 class="mb-4 text-center">اطلاعات خریدار</h3>

                <form method="POST" novalidate>
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label">
                                {{ field.label }}
                            </label>

                            {{ field }}

                            {% if field.errors %}
                                <div class="text-danger small mt-1">
                                    {{ field.errors }}
                                </div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <div class="border rounded p-3 mb-4">
                        <strong>مبلغ قابل پرداخت:</strong>
                        <span class="float-end">
                            {{ cart.get_total_price }} تومان
                        </span>
                    </div>

                    <button type="submit"
                            class="btn btn-book-detail w-100">
                        ادامه و پرداخت
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
